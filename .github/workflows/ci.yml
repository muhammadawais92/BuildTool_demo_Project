name: CI

on:
  push:
    branches:
      - main
      - '**'  # run on all branches
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]  # Node versions to test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          CI: true  # ensures Vitest runs correctly in headless mode

      - name: Run ESLint (code analysis)
        run: npm run lint

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        with:
          config_path: .gitleaks.toml  # optional if you have custom rules
          redact: true
          report_format: sarif
          report_path: results-${{ matrix.node-version }}.sarif
          exit_code: 2
          verbose: true

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ matrix.node-version }}
          path: results-${{ matrix.node-version }}.sarif

