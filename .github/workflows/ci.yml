name: CI

on:
  push:
    branches:
      - main
      - '**'  # run on all branches
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]  # Node versions to test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          CI: true  # ensures Vitest runs correctly in headless mode

      - name: Run ESLint (code analysis)
        run: npm run lint

      - name: Run Gitleaks secret scan
        uses: gacts/gitleaks@v1
        with:
          version: latest         
          config-path: ""         
          path: "."               

      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ matrix.node-version }}
          path: results-${{ matrix.node-version }}.sarif
